name: Monitoring drift hebdomadaire

on:
  workflow_dispatch: {}

jobs:
  drift-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: pip install evidently

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Générer les rapports de drift
        run: python monitoring.py

      - name: Sauvegarder les rapports comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            monitoring_report_reference.html
            monitoring_report_fake_drift.html
            monitoring_report_real.html
        if: always()